version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.READER_TOKEN}}
    replaces-base: false
updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - npm-github
    schedule:
      interval: daily
      time: '05:00'
      timezone: Europe/Oslo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      major:
        update-types:
          - 'major'
      minor-and-patch:
        update-types:
          - 'patch'
          - 'minor'
    ignore:
      - dependency-name: 'typescript'
        # Vent til 7.1.0 kommer pga bedre støtte
        versions: ['7.0.x']

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
