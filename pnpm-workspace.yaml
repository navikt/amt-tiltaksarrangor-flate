packages:
  - "."

allowBuilds:
  '@swc/core': false
  esbuild: true
  msw: true
  protobufjs: false
  '@parcel/watcher': false

overrides:
  "fast-uri@>=3.0.0 <3.1.6": "3.1.6"
  "brace-expansion@<1.1.21": "1.1.21"
  "figlet@>=1.11.0 <1.11.3": "1.11.3"

# Pakker må være 7 dager gamle før de kan installeres (likt som dependabot cooldown)
# Et sikkerhetstiltak i tilfelle en pakke blir komprimittert
minimumReleaseAge: 10080 # 24 x 60 x 7

minimumReleaseAgeExclude:
  - '@navikt/nav-dekoratoren-moduler@4.5.0'
